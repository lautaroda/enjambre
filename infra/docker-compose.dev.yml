# Fase 0 — M0.2 (smoke test un solo nodo) y M0.3 (partición multi-nodo en una máquina).
# Ver docs/roadmap.md. Corre completamente en localhost: NO ejercita el NAT traversal
# real de hivemind (eso es M0.5, en máquinas separadas).
#
# Rough edge conocido: hivemind necesita el peer ID del bootstrap para que los demás
# nodos se conecten (`--initial_peers`). Ese ID se genera en runtime la primera vez que
# el bootstrap arranca, así que no se puede hardcodear acá. Flujo:
#
#   docker compose -f infra/docker-compose.dev.yml up bootstrap
#   ./infra/scripts/get-bootstrap-peer.sh        # imprime BOOTSTRAP_MADDR=...
#   export BOOTSTRAP_MADDR=/ip4/127.0.0.1/tcp/31337/p2p/<peer-id-impreso>
#   docker compose -f infra/docker-compose.dev.yml up node-1 node-2 node-3
#
# M0.2 (un solo nodo con el modelo completo, sin partición):
#   docker compose -f infra/docker-compose.dev.yml --profile smoke up bootstrap single-node

services:
  bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/swarm-node.Dockerfile
    image: enjambre/swarm-node:dev
    command: >
      --model bigscience/bloom-560m
      --new_swarm
      --identity_path /root/.hivemind/bootstrap.id
      --host_maddrs /ip4/0.0.0.0/tcp/31337
    ports:
      - "31337:31337"
    volumes:
      - bootstrap-identity:/root/.hivemind

  # --- M0.2: smoke test, un solo nodo hostea todos los bloques ---
  single-node:
    profiles: ["smoke"]
    image: enjambre/swarm-node:dev
    depends_on: [bootstrap]
    command: >
      --model bigscience/bloom-560m
      --initial_peers ${BOOTSTRAP_MADDR:?ver instrucciones arriba}

  # --- M0.3: partición en 3 nodos (bloom-560m tiene 24 bloques transformer) ---
  node-1:
    image: enjambre/swarm-node:dev
    depends_on: [bootstrap]
    command: >
      --model bigscience/bloom-560m
      --initial_peers ${BOOTSTRAP_MADDR:?ver instrucciones arriba}
      --block_indices 0:8

  node-2:
    image: enjambre/swarm-node:dev
    depends_on: [bootstrap]
    command: >
      --model bigscience/bloom-560m
      --initial_peers ${BOOTSTRAP_MADDR:?ver instrucciones arriba}
      --block_indices 8:16

  node-3:
    image: enjambre/swarm-node:dev
    depends_on: [bootstrap]
    command: >
      --model bigscience/bloom-560m
      --initial_peers ${BOOTSTRAP_MADDR:?ver instrucciones arriba}
      --block_indices 16:24

  # Contenedor "cliente": no corre un server de petals, solo queda disponible para
  # correr benchmarks/correctness_check.py adentro (mismo entorno Python que los nodos).
  client:
    image: enjambre/swarm-node:dev
    depends_on: [node-1, node-2, node-3]
    entrypoint: ["sleep", "infinity"]
    environment:
      - BOOTSTRAP_MADDR=${BOOTSTRAP_MADDR:?ver instrucciones arriba}

volumes:
  bootstrap-identity:
